<!-- @dsCard group="Estados" height=210 subtitle="O verde da ação entra a 20% e sobe a 62% no hover. Press vai a 78% e reduz a escala" page -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:transparent}.ovx-stage{box-sizing:border-box;min-height:100%;padding:16px;background:var(--bg-deep);color:var(--text-body);font-family:var(--font-body);border-radius:var(--radius-card);border:1px solid var(--border);overflow:hidden}.ovx-stage *,.ovx-stage *::before,.ovx-stage *::after{box-sizing:border-box}.ovx-stage img{max-width:100%}@media (max-width:480px){.ovx-stage{padding:12px;border-radius:var(--radius-md)}}.ovx-stage{margin:0;padding:16px;background:radial-gradient(120% 130% at 14% 0%,var(--surface-2) 0%,var(--bg) 52%,var(--bg-deep) 100%)}.g{display:flex;flex-direction:column;gap:14px}.r{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}.r span{font:var(--type-caption);color:var(--text-subtle);flex:0 0 88px;font-family:var(--font-mono);font-size:11px}</style>
</head><body><div class="ovx-stage"><div class="g">
<div class="r"><span>repouso</span><button class="ovx-btn ovx-btn--primary">Falar com consultor</button><button class="ovx-btn ovx-btn--secondary">Ver linha</button><span class="ovx-tag">Emulsão</span></div>
<div class="r"><span>hover</span><button class="ovx-btn ovx-btn--primary" style="background:var(--action-bg-hover);border-color:var(--action-border-hover);color:var(--action-fg-hover);box-shadow:var(--shadow-2),var(--glow-accent-soft),var(--sheen-top-strong)">Falar com consultor</button><button class="ovx-btn ovx-btn--secondary" style="background:var(--claro-a06);border-color:var(--claro-a24)">Ver linha</button><span class="ovx-tag ovx-tag--interactive" style="border-color:var(--verde-a40);color:var(--text-strong);background:var(--verde-a06)">Emulsão</span></div>
<div class="r"><span>press</span><button class="ovx-btn ovx-btn--primary" style="background:var(--action-bg-active);border-color:var(--action-border-hover);color:var(--action-fg-hover);transform:scale(.99)">Falar com consultor</button><button class="ovx-btn ovx-btn--secondary" style="background:var(--claro-a24);transform:scale(.99)">Ver linha</button></div>
<div class="r"><span>desativado</span><button class="ovx-btn ovx-btn--primary" disabled>Falar com consultor</button><button class="ovx-btn ovx-btn--secondary" disabled>Ver linha</button></div>
</div></div></body></html>
