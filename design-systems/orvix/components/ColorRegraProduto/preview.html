<!-- @dsCard group="Cores de Produto" height=230 subtitle="Uma cor de produto por bloco, sempre com o verde institucional na ação" page -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:transparent}.ovx-stage{box-sizing:border-box;min-height:100%;padding:16px;background:var(--bg-deep);color:var(--text-body);font-family:var(--font-body);border-radius:var(--radius-card);border:1px solid var(--border);overflow:hidden}.ovx-stage *,.ovx-stage *::before,.ovx-stage *::after{box-sizing:border-box}.ovx-stage img{max-width:100%}@media (max-width:480px){.ovx-stage{padding:12px;border-radius:var(--radius-md)}}.ovx-stage{margin:0;padding:16px;background:var(--bg-deep)}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.h{font-family:var(--font-display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px}.h::before{content:"";width:8px;height:8px;border-radius:50%}.ok .h{color:var(--text-accent)}.ok .h::before{background:var(--verde-500)}.no .h{color:var(--text-danger)}.no .h::before{background:var(--produto-vermelho)}</style>
</head><body><div class="ovx-stage"><div class="g">
<div class="ok"><div class="h">Assim</div>
<div class="ovx-line" style="--linha:var(--produto-azul)"><span class="ovx-line__badge">Linha TEC · Redução de deriva</span><h3 class="ovx-line__name">ORV7 Aero Guard</h3><p class="ovx-line__promise">A cor azul marca a linha. A ação segue verde.</p><button class="ovx-btn ovx-btn--primary ovx-btn--sm" style="align-self:flex-start">Ver ficha</button></div></div>
<div class="no"><div class="h">Não assim</div>
<div class="ovx-line" style="--linha:var(--produto-azul);border-color:var(--produto-azul)"><span class="ovx-line__badge">Linha TEC · Redução de deriva</span><h3 class="ovx-line__name" style="color:var(--produto-azul)">ORV7 Aero Guard</h3><p class="ovx-line__promise">Cor de produto vestindo texto, borda e botão.</p><button class="ovx-btn ovx-btn--sm" style="align-self:flex-start;background:var(--produto-azul);color:#fff">Ver ficha</button></div></div>
</div></div></body></html>
