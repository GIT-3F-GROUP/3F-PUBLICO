<!-- @dsCard group="Marca" height=300 subtitle="Alvo redondo e alvo quadrado, estático ou com pulso no núcleo" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:transparent}.ovx-stage{box-sizing:border-box;min-height:100%;padding:16px;background:var(--bg-deep);color:var(--text-body);font-family:var(--font-body);border-radius:var(--radius-card);border:1px solid var(--border);overflow:hidden}.ovx-stage *,.ovx-stage *::before,.ovx-stage *::after{box-sizing:border-box}.ovx-stage img{max-width:100%}@media (max-width:480px){.ovx-stage{padding:12px;border-radius:var(--radius-md)}}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.stack{display:flex;flex-direction:column;gap:12px}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;align-items:start}.lbl{font-family:var(--font-display);font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--label-fg)}code,.mono{font-family:var(--font-mono);font-size:12px;color:var(--text-muted)}.cell{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px;border-radius:var(--radius-md);background:var(--surface-1);border:1px solid var(--border)}</style>
</head><body><div class="ovx-stage"><div id="root"></div>
<script>
const h = React.createElement, F = React.Fragment;
const noop = () => {};
const { TargetMark } = window.ORVIXDesignSystem_019de6;
function Demo() {
  const cell = (el, t) => h("div", { className: "cell", key: t }, el, h("span", { className: "lbl" }, t));
  return h("div", { className: "stack" },
    h("div", { className: "row", style: { alignItems: "flex-end" } },
      cell(h(TargetMark, { forma: "redondo", size: 120 }), "Redondo"),
      cell(h(TargetMark, { forma: "quadrado", size: 120 }), "Quadrado"),
      cell(h(TargetMark, { forma: "redondo", size: 120, live: true }), "Redondo · ao vivo"),
      cell(h(TargetMark, { forma: "quadrado", size: 120, live: true }), "Quadrado · ao vivo")),
    h("div", { className: "row", style: { alignItems: "flex-end" } }, [32, 48, 72].map((s) => cell(h("span", { className: "row", style: { gap: 10 } }, h(TargetMark, { forma: "redondo", size: s }), h(TargetMark, { forma: "quadrado", size: s })), s + "px"))));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(Demo));
</script></div></body></html>
