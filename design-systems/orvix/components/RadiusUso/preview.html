<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:transparent}.ovx-stage{box-sizing:border-box;min-height:100%;padding:16px;background:var(--bg-deep);color:var(--text-body);font-family:var(--font-body);border-radius:var(--radius-card);border:1px solid var(--border);overflow:hidden}.ovx-stage *,.ovx-stage *::before,.ovx-stage *::after{box-sizing:border-box}.ovx-stage img{max-width:100%}@media (max-width:480px){.ovx-stage{padding:12px;border-radius:var(--radius-md)}}.ovx-stage{margin:0;padding:16px;background:var(--bg-deep)}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.c{padding:14px;background:var(--surface-2);border:1px solid var(--claro-a10);display:flex;flex-direction:column;gap:8px;justify-content:center;min-height:96px}.c b{font-family:var(--font-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-body)}.c code{font-family:var(--font-mono);font-size:11px;color:var(--text-subtle)}</style>
</head><body><div class="ovx-stage"><div class="g">
