<!-- @dsCard group="Cores" height=200 subtitle="A marca prefere opacidade sobre os dois tons-base a criar novos hexadecimais" page -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:transparent}.ovx-stage{box-sizing:border-box;min-height:100%;padding:16px;background:var(--bg-deep);color:var(--text-body);font-family:var(--font-body);border-radius:var(--radius-card);border:1px solid var(--border);overflow:hidden}.ovx-stage *,.ovx-stage *::before,.ovx-stage *::after{box-sizing:border-box}.ovx-stage img{max-width:100%}@media (max-width:480px){.ovx-stage{padding:12px;border-radius:var(--radius-md)}}.ovx-stage{margin:0;padding:16px;background:var(--bg-deep)}.rows{display:flex;flex-direction:column;gap:8px}.row{display:flex;gap:6px}.c{flex:1;height:38px;border-radius:var(--radius-sm);display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px;font-family:var(--font-mono);font-size:11px;color:var(--text-subtle)}.lb{font:var(--type-eyebrow);letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--text-subtle)}</style>
</head><body><div class="ovx-stage"><div class="rows">
<span class="lb">Claro sobre escuro</span>
<div class="row">
<div class="c" style="background:var(--claro-a90)">90</div><div class="c" style="background:var(--claro-a72)">72</div><div class="c" style="background:var(--claro-a56)">56</div><div class="c" style="background:var(--claro-a40)">40</div><div class="c" style="background:var(--claro-a24)">24</div><div class="c" style="background:var(--claro-a14)">14</div><div class="c" style="background:var(--claro-a10)">10</div><div class="c" style="background:var(--claro-a06)">06</div><div class="c" style="background:var(--claro-a03)">03</div></div>
<span class="lb">Verde sobre escuro</span>
<div class="row">
<div class="c" style="background:var(--verde-a40)">40</div><div class="c" style="background:var(--verde-a24)">24</div><div class="c" style="background:var(--verde-a18)">18</div><div class="c" style="background:var(--verde-a12)">12</div><div class="c" style="background:var(--verde-a06)">06</div></div>
</div></div></body></html>
