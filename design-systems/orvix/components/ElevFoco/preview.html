<!-- @dsCard group="Elevação e Sombra" height=180 subtitle="Halo curto de 3px no foco. Sheen de 1px no topo é assinatura do vidro" page -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:transparent}.ovx-stage{box-sizing:border-box;min-height:100%;padding:16px;background:var(--bg-deep);color:var(--text-body);font-family:var(--font-body);border-radius:var(--radius-card);border:1px solid var(--border);overflow:hidden}.ovx-stage *,.ovx-stage *::before,.ovx-stage *::after{box-sizing:border-box}.ovx-stage img{max-width:100%}@media (max-width:480px){.ovx-stage{padding:12px;border-radius:var(--radius-md)}}.ovx-stage{margin:0;padding:16px;background:var(--bg-deep)}.g{display:flex;flex-wrap:wrap;gap:16px;align-items:center;flex-wrap:wrap}.c{padding:12px 16px;border-radius:var(--radius-card);background:var(--surface-2);border:1px solid var(--claro-a10);font:var(--type-body-sm);color:var(--text-body)}</style>
</head><body><div class="ovx-stage"><div class="g">
<button class="ovx-btn ovx-btn--primary" style="box-shadow:var(--ring-focus)">Foco visível</button>
<div class="c" style="box-shadow:var(--ring-accent)">ring-accent</div>
<div class="c" style="box-shadow:var(--glow-accent)">glow-accent</div>
<div class="c" style="box-shadow:var(--sheen-top-strong),var(--shadow-2)">sheen-top</div>
<div class="c" style="box-shadow:var(--inset-field);background:var(--field-bg)">inset-field</div>
</div></div></body></html>
