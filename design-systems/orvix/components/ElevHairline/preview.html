<!-- @dsCard group="Elevação e Sombra" height=200 subtitle="A separação entre blocos vem da linha de 1px com uma sombra baixa e suave (shadow-1 ou shadow-2), nunca de elevação pesada" page -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:transparent}.ovx-stage{box-sizing:border-box;min-height:100%;padding:16px;background:var(--bg-deep);color:var(--text-body);font-family:var(--font-body);border-radius:var(--radius-card);border:1px solid var(--border);overflow:hidden}.ovx-stage *,.ovx-stage *::before,.ovx-stage *::after{box-sizing:border-box}.ovx-stage img{max-width:100%}@media (max-width:480px){.ovx-stage{padding:12px;border-radius:var(--radius-md)}}.ovx-stage{margin:0;padding:16px;background:var(--bg-deep)}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.h{font-family:var(--font-display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}.ok .h{color:var(--text-accent)}.no .h{color:var(--text-danger)}.stack>div{padding:11px 14px}</style>
</head><body><div class="ovx-stage"><div class="g">
<div class="ok"><div class="h">Assim · hairline + shadow-1</div><div class="stack" style="background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius-card);overflow:hidden;box-shadow:var(--shadow-1)">
<div style="border-bottom:1px solid var(--border)">Preparo da calda</div><div style="border-bottom:1px solid var(--border)">Formação da gota</div><div>Deposição no alvo</div></div></div>
<div class="no"><div class="h">Não assim</div><div class="stack" style="display:flex;flex-direction:column;gap:8px">
<div style="background:var(--surface-2);border-radius:var(--radius-card);box-shadow:0 12px 34px rgba(16,23,32,.7)">Preparo da calda</div><div style="background:var(--surface-2);border-radius:var(--radius-card);box-shadow:0 12px 34px rgba(16,23,32,.7)">Formação da gota</div><div style="background:var(--surface-2);border-radius:var(--radius-card);box-shadow:0 12px 34px rgba(16,23,32,.7)">Deposição no alvo</div></div></div>
</div></div></body></html>
