<!-- @dsCard group="Padrões de Fundo" height=200 subtitle="Malha pontilhada como assinatura gráfica, grade de precisão como fundo de seção" page -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:transparent}.ovx-stage{box-sizing:border-box;min-height:100%;padding:16px;background:var(--bg-deep);color:var(--text-body);font-family:var(--font-body);border-radius:var(--radius-card);border:1px solid var(--border);overflow:hidden}.ovx-stage *,.ovx-stage *::before,.ovx-stage *::after{box-sizing:border-box}.ovx-stage img{max-width:100%}@media (max-width:480px){.ovx-stage{padding:12px;border-radius:var(--radius-md)}}.ovx-stage{margin:0;padding:16px;background:var(--bg-deep)}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.c{height:120px;border-radius:var(--radius-card);border:1px solid var(--claro-a10);background-color:var(--surface-1)}.lbl{font-family:var(--font-mono);font-size:11px;color:var(--text-subtle);margin-top:6px;display:block}</style>
</head><body><div class="ovx-stage"><div class="g">
<div><div class="c orvix-dots"></div><span class="lbl">orvix-dots · 6px</span></div>
<div><div class="c orvix-dots--dense"></div><span class="lbl">dots dense · 4px</span></div>
<div><div class="c orvix-dots--suave"></div><span class="lbl">dots suave · 4px · padrão de uso</span></div>
<div><div class="c orvix-grid-fx"></div><span class="lbl">grid-fx · 48px</span></div>
</div></div></body></html>
