<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:transparent}.ovx-stage{box-sizing:border-box;min-height:100%;padding:16px;background:var(--bg-deep);color:var(--text-body);font-family:var(--font-body);border-radius:var(--radius-card);border:1px solid var(--border);overflow:hidden}.ovx-stage *,.ovx-stage *::before,.ovx-stage *::after{box-sizing:border-box}.ovx-stage img{max-width:100%}@media (max-width:480px){.ovx-stage{padding:12px;border-radius:var(--radius-md)}}.ovx-stage{margin:0;padding:16px;background:var(--bg-deep)}.ramp{display:flex;flex-wrap:wrap;gap:6px}.sw{flex:1 1 52px;display:flex;flex-direction:column;gap:5px;min-width:0}.sw span{display:block;height:56px;border-radius:var(--radius-sm);border:1px solid var(--claro-a10)}.sw b{font:var(--type-label);font-family:var(--font-display);color:var(--text-body);font-size:11px}.sw code{font-family:var(--font-mono);font-size:11px;color:var(--text-subtle);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}</style>
</head><body><div class="ovx-stage"><div class="ramp"><div class="sw"><span style="background:var(--grafite-100)"></span><b>100</b><code>grafite-100</code></div><div class="sw"><span style="background:var(--grafite-200)"></span><b>200</b><code>grafite-200</code></div><div class="sw"><span style="background:var(--grafite-300)"></span><b>300</b><code>grafite-300</code></div><div class="sw"><span style="background:var(--grafite-400)"></span><b>400</b><code>grafite-400</code></div><div class="sw"><span style="background:var(--grafite-500)"></span><b>500</b><code>grafite-500</code></div><div class="sw"><span style="background:var(--grafite-600)"></span><b>600</b><code>grafite-600</code></div><div class="sw"><span style="background:var(--grafite-700)"></span><b>700</b><code>grafite-700</code></div><div class="sw"><span style="background:var(--grafite-800)"></span><b>800</b><code>grafite-800</code></div><div class="sw"><span style="background:var(--grafite-900)"></span><b>900</b><code>grafite-900 · preto</code></div><div class="sw"><span style="background:var(--grafite-950)"></span><b>950</b><code>grafite-950</code></div><div class="sw"><span style="background:var(--grafite-1000)"></span><b>1000</b><code>grafite-1000</code></div></div></div></body></html>
