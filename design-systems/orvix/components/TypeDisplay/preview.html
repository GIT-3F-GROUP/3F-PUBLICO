<!-- @dsCard group="Escala Tipográfica" height=360 subtitle="Exo ExtraBold 800, caixa alta, tracking −0,015em no display e −0,01em no H1" page -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:transparent}.ovx-stage{box-sizing:border-box;min-height:100%;padding:16px;background:var(--bg-deep);color:var(--text-body);font-family:var(--font-body);border-radius:var(--radius-card);border:1px solid var(--border);overflow:hidden}.ovx-stage *,.ovx-stage *::before,.ovx-stage *::after{box-sizing:border-box}.ovx-stage img{max-width:100%}@media (max-width:480px){.ovx-stage{padding:12px;border-radius:var(--radius-md)}}.ovx-stage{margin:0;padding:16px;background:var(--bg-deep)}.r{display:grid;grid-template-columns:150px minmax(0,1fr);align-items:baseline;gap:6px 16px;padding:10px 0;border-bottom:1px solid var(--border)}.r:last-child{border-bottom:0}.spec{display:flex;flex-direction:column;gap:2px}.spec b{font-family:var(--font-display);font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--label-fg)}.spec code{font-family:var(--font-mono);font-size:11px;color:var(--text-subtle)}.t{font-family:var(--font-display);font-weight:800;text-transform:uppercase;color:var(--text-strong);min-width:0;overflow-wrap:anywhere}.xl{font-size:var(--fs-display-xl);line-height:var(--lh-tight);letter-spacing:var(--ls-tighter)}.d{font-size:var(--fs-display);line-height:var(--lh-tight);letter-spacing:var(--ls-tighter)}.h1{font-size:var(--fs-h1);line-height:1.02;letter-spacing:var(--ls-tight)}.h2{font-size:var(--fs-h2);line-height:var(--lh-heading);letter-spacing:var(--ls-tight)}@media (max-width:520px){.r{grid-template-columns:1fr}}</style>
</head><body><div class="ovx-stage"><div>
<div class="r"><div class="spec"><b>Display XL</b><code>Exo 800 · 52/0,94 · −0,015em</code></div><span class="t xl">ORVIX</span></div>
<div class="r"><div class="spec"><b>Display</b><code>Exo 800 · 44/0,94 · −0,015em</code></div><span class="t d">Elo de força</span></div>
<div class="r"><div class="spec"><b>H1</b><code>Exo 800 · 33/1,02 · −0,01em</code></div><span class="t h1">Elo de força com a produtividade</span></div>
<div class="r"><div class="spec"><b>H2</b><code>Exo 800 · 29/1,12 · −0,01em</code></div><span class="t h2">Três frentes de ação</span></div>
</div></div></body></html>
