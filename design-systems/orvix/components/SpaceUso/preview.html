<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:transparent}.ovx-stage{box-sizing:border-box;min-height:100%;padding:16px;background:var(--bg-deep);color:var(--text-body);font-family:var(--font-body);border-radius:var(--radius-card);border:1px solid var(--border);overflow:hidden}.ovx-stage *,.ovx-stage *::before,.ovx-stage *::after{box-sizing:border-box}.ovx-stage img{max-width:100%}@media (max-width:480px){.ovx-stage{padding:12px;border-radius:var(--radius-md)}}.ovx-stage{margin:0;padding:16px;background:var(--bg-deep)}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.tag{position:absolute;font-family:var(--font-mono);font-size:11px;color:var(--text-accent)}</style>
</head><body><div class="ovx-stage"><div class="g">
<div class="ovx-card" style="position:relative"><div class="ovx-card__header"><div><div class="ovx-card__title">ORV7 Drop Power</div><div class="ovx-card__sub">Adjuvante premium</div></div></div><p class="ovx-card__body">Emulsificante, dispersante e antiespumante em um só produto.</p><div class="ovx-card__footer"><span class="orvix-mono">30 a 200 mL/ha</span><span class="ovx-badge">5 L</span></div><span class="tag" style="top:4px;left:4px">pad-card 20</span></div>
<div style="display:flex;flex-direction:column;gap:8px;font:var(--type-caption);color:var(--text-muted)">
<div><b style="color:var(--text-body)">--pad-control-y/x</b> 9px / 14px</div>
<div><b style="color:var(--text-body)">--pad-card</b> 20px</div>
<div><b style="color:var(--text-body)">--pad-card-lg</b> 28px</div>
<div><b style="color:var(--text-body)">--pad-panel</b> 32px</div>
<div><b style="color:var(--text-body)">--gap-inline / --gap</b> 8px / 16px</div>
<div><b style="color:var(--text-body)">--touch-min</b> 44px, alvo de campo</div>
</div>
</div></div></body></html>
