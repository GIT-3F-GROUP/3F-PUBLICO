<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:transparent}.ovx-stage{box-sizing:border-box;min-height:100%;padding:16px;background:var(--bg-deep);color:var(--text-body);font-family:var(--font-body);border-radius:var(--radius-card);border:1px solid var(--border);overflow:hidden}.ovx-stage *,.ovx-stage *::before,.ovx-stage *::after{box-sizing:border-box}.ovx-stage img{max-width:100%}@media (max-width:480px){.ovx-stage{padding:12px;border-radius:var(--radius-md)}}.ovx-stage{margin:0;padding:16px;background:var(--bg-deep)}.ovx-stage{background:radial-gradient(90% 110% at 18% 8%,#1B4A2A 0%,var(--bg) 55%,var(--bg-deep) 100%)}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}.c{padding:16px;min-height:120px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}.c b{font-family:var(--font-display);font-size:11px;color:var(--text-strong)}.c code{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style>
</head><body><div class="ovx-stage"><div class="g">
<div class="c orvix-glass orvix-glass--thin"><b>thin</b><code>30% · blur 14</code></div>
<div class="c orvix-glass"><b>base</b><code>42% · blur 20</code></div>
<div class="c orvix-glass orvix-glass--solid"><b>solid</b><code>62% · blur 28</code></div>
<div class="c orvix-glass orvix-glass--verde"><b>verde</b><code>verde 10% · borda 28%</code></div>
</div></div></body></html>
