<!-- @dsCard group="Cores" height=150 subtitle="O verde nunca vira alerta: sucesso é o único tom verde" page -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:transparent}.ovx-stage{box-sizing:border-box;min-height:100%;padding:16px;background:var(--bg-deep);color:var(--text-body);font-family:var(--font-body);border-radius:var(--radius-card);border:1px solid var(--border);overflow:hidden}.ovx-stage *,.ovx-stage *::before,.ovx-stage *::after{box-sizing:border-box}.ovx-stage img{max-width:100%}@media (max-width:480px){.ovx-stage{padding:12px;border-radius:var(--radius-md)}}.ovx-stage{margin:0;padding:16px;background:var(--bg-deep)}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.c{padding:12px;border-radius:var(--radius-card);display:flex;flex-direction:column;gap:5px}.c b{font-family:var(--font-display);font-size:12px;letter-spacing:.06em;text-transform:uppercase}.c code{font-family:var(--font-mono);font-size:11px;color:var(--text-subtle)}</style>
</head><body><div class="ovx-stage"><div class="g">
<div class="c" style="background:var(--status-success-soft);border:1px solid var(--verde-a24)"><b style="color:var(--text-success)">Sucesso</b><code>--status-success</code></div>
<div class="c" style="background:var(--status-warning-soft);border:1px solid rgba(224,168,30,.28)"><b style="color:var(--text-warning)">Aviso</b><code>--status-warning</code></div>
<div class="c" style="background:var(--status-danger-soft);border:1px solid rgba(210,46,58,.28)"><b style="color:var(--text-danger)">Erro</b><code>--status-danger</code></div>
<div class="c" style="background:var(--status-info-soft);border:1px solid rgba(28,127,196,.28)"><b style="color:var(--text-info)">Informação</b><code>--status-info</code></div>
</div></div></body></html>
