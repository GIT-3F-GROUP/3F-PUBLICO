<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:#080C12}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.c{height:110px;border-radius:var(--radius-card);display:grid;place-items:center;border:1px solid rgba(210,46,58,.35);background:var(--surface-1)}.c img{height:38px}.lbl{font-family:var(--font-display);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#F08A91;margin-top:6px;display:block}</style>
</head><body><div class="g">
<div><div class="c"><img src="../assets/logos/orvix-logo-clara.svg" style="transform:scaleX(1.5)" alt=""></div><span class="lbl">distorcer</span></div>
<div><div class="c"><img src="../assets/logos/orvix-logo-clara.svg" style="filter:hue-rotate(200deg) saturate(3)" alt=""></div><span class="lbl">recolorir</span></div>
<div><div class="c"><img src="../assets/logos/orvix-logo-clara.svg" style="filter:drop-shadow(1px 0 0 #13A538) drop-shadow(-1px 0 0 #13A538) drop-shadow(0 1px 0 #13A538) drop-shadow(0 -1px 0 #13A538)" alt=""></div><span class="lbl">contornar</span></div>
<div><div class="c" style="background:#A5AFB5"><img src="../assets/logos/orvix-logo-clara.svg" alt=""></div><span class="lbl">baixo contraste</span></div>
</div></body></html>
