<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px 20px;background:var(--brand-amarelo-suave);font-family:var(--ff-body)}
.r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.t{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);font-weight:700}
</style></head><body>
<div style="display:grid;grid-template-columns:110px 62px 1fr;gap:18px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--rule-soft)">
<span class="t">Display</span><span style="font-size:11px;color:var(--brand-laranjado);font-weight:700">60 px</span>
<span style="font-size:44px;font-weight:800;letter-spacing:-.01em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><span class="bry-w-md">Bary</span><span class="bry-w-xb">gen</span></span></div><div style="display:grid;grid-template-columns:110px 62px 1fr;gap:18px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--rule-soft)">
<span class="t">H1</span><span style="font-size:11px;color:var(--brand-laranjado);font-weight:700">56 px</span>
<span style="font-size:34px;font-weight:800;letter-spacing:-.01em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Título principal</span></div><div style="display:grid;grid-template-columns:110px 62px 1fr;gap:18px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--rule-soft)">
<span class="t">H2</span><span style="font-size:11px;color:var(--brand-laranjado);font-weight:700">48 px</span>
<span style="font-size:29px;font-weight:800;letter-spacing:-.01em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Título de seção</span></div><div style="display:grid;grid-template-columns:110px 62px 1fr;gap:18px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--rule-soft)">
<span class="t">H3</span><span style="font-size:11px;color:var(--brand-laranjado);font-weight:700">40 px</span>
<span style="font-size:24px;font-weight:800;letter-spacing:-.01em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Subtítulo de página</span></div><div style="display:grid;grid-template-columns:110px 62px 1fr;gap:18px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--rule-soft)">
<span class="t">H4</span><span style="font-size:11px;color:var(--brand-laranjado);font-weight:700">32 px</span>
<span style="font-size:20px;font-weight:800;letter-spacing:-.01em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Bloco de conteúdo</span></div><div style="display:grid;grid-template-columns:110px 62px 1fr;gap:18px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--rule-soft)">
<span class="t">Corpo grande</span><span style="font-size:11px;color:var(--brand-laranjado);font-weight:700">18 px</span>
<span style="font-size:18px;font-weight:400;letter-spacing:-.01em;text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Texto de abertura e leads de seção.</span></div><div style="display:grid;grid-template-columns:110px 62px 1fr;gap:18px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--rule-soft)">
<span class="t">Corpo</span><span style="font-size:11px;color:var(--brand-laranjado);font-weight:700">16 px</span>
<span style="font-size:16px;font-weight:400;letter-spacing:-.01em;text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Texto corrido padrão para leitura confortável.</span></div><div style="display:grid;grid-template-columns:110px 62px 1fr;gap:18px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--rule-soft)">

<span style="font-size:12px;font-weight:500;letter-spacing:-.01em;text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Notas, créditos e informações legais.</span></div></body></html>
