<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:16px 20px;background:var(--brand-amarelo-suave);font-family:var(--ff-body)}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.t{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);font-weight:700}
.sw{border-radius:8px;overflow:hidden;border:1px solid var(--rule-soft);background:#fff;flex:1;min-width:74px}
.sw i{display:block;height:56px}.sw u{display:block;text-decoration:none;padding:6px 8px;font-size:10px;font-weight:700;line-height:1.4}
.sw u b{display:block;font-size:9.5px;color:var(--text-muted);font-weight:600;letter-spacing:.04em}
</style></head><body>
<div class="r" style="gap:14px">
 <div style="flex:1;text-align:center"><div style="background:#fff;border:1px solid var(--rule-soft);border-radius:12px;padding:24px;display:flex;justify-content:center"><img src="../assets/logos/logo-completa-colorida-escura.svg" style="height:42px"></div><div class="t" style="margin-top:8px">Fundo claro</div></div>
 <div style="flex:1;text-align:center"><div style="background:var(--brand-preto);border-radius:12px;padding:24px;display:flex;justify-content:center"><img src="../assets/logos/logo-completa-colorida-clara.svg" style="height:42px"></div><div class="t" style="margin-top:8px">Fundo preto</div></div>
 <div style="flex:1;text-align:center"><div style="background:var(--brand-amarelo-principal);border-radius:12px;padding:24px;display:flex;justify-content:center"><img src="../assets/logos/logo-completa-escura.svg" style="height:42px"></div><div class="t" style="margin-top:8px">Fundo amarelo</div></div>
</div></body></html>
