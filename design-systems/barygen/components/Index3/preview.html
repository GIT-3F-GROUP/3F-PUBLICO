<!-- @dsCard group="Site institucional" height=760 subtitle="Home, híbrido, campos, eventos e contato: clicável" page -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>BARYGEN · Site institucional</title>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>body{background:var(--brand-amarelo-suave)}#root{min-height:100vh}
.site-wrap{max-width:1240px;margin:0 auto;padding:0 var(--gutter)}
.site-topbar{background:var(--brand-preto);position:sticky;top:0;z-index:20}
.site-topbar .inner{max-width:1240px;margin:0 auto;padding:12px var(--gutter);display:flex;align-items:center;justify-content:space-between;gap:24px}
.site-topbar img{height:30px}
.site-links{display:flex;gap:26px;font-size:13.5px;font-weight:600;color:var(--text-on-dark-muted)}
.site-links span{cursor:pointer;transition:color .15s}.site-links span:hover{color:var(--brand-amarelo-suave)}
.site-links .on{color:var(--brand-amarelo-principal)}
.ph{background:var(--brand-amarelo-claro);display:flex;align-items:center;justify-content:center;color:var(--text-soft);font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}
[class*="bry-sec-dark"] .ph,[class*="bry-sec-tom-preto"] .ph{background:var(--tom-preto-2);color:var(--text-on-dark-muted)}
/* Responsivo: de 320 px ao desktop, nada estoura na horizontal */
@media (max-width:820px){
  .site-topbar .inner{flex-wrap:wrap;row-gap:10px}
  .site-links{order:3;width:100%;overflow-x:auto;scrollbar-width:none;gap:22px;padding-bottom:2px}
  .site-links span{white-space:nowrap;padding:10px 0}
  .kit-grid{grid-template-columns:minmax(0,1fr)!important;gap:28px!important}
}
</style></head><body><div id="root"></div>
<script type="text/babel" src="Sections.jsx"></script>
<script type="text/babel" src="Home.jsx"></script>
<script type="text/babel" src="Hibrido.jsx"></script>
<script type="text/babel" src="Campos.jsx"></script>
<script type="text/babel" src="Contato.jsx"></script>
<script type="text/babel">
const {SiteFooter}=window.BarygenDesignSystem_a84d4b;
const {SiteHeader}=window;
function App(){
  const [page,setPage]=React.useState('Híbridos');
  const go=p=>{setPage(p);window.scrollTo(0,0)};
  const Screen={'Híbridos':window.Home,'Tecnologia':window.Hibrido,'Onde comprar':window.Campos,'Eventos':window.Campos,'Contato':window.Contato}[page]||window.Home;
  return <div>
    <SiteHeader page={page} go={go}/>
    <Screen go={go} mode={page==='Eventos'?'eventos':'campos'}/>
    <SiteFooter cnpj="00.000.000/0000-00"
      columns={[{title:'Produtos',links:['BG307 Max','Pipeline','Posicionamento']},{title:'A BARYGEN',links:['Quem somos','Eventos','Notícias','Trabalhe conosco']},{title:'Contato',links:['Consultores','Onde comprar','Imprensa']}]}/>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
