html,body{margin:0;background:#e9e5dc}
body{font-family:"Be Vietnam Pro",sans-serif;width:2340px;height:2100px;position:relative}

.t{font-family:"Commissioner",sans-serif;text-transform:uppercase;line-height:1.02;margin:0}
.t b{font-weight:800}.t i{font-style:normal;font-weight:600}
.lb{font:700 22px "Be Vietnam Pro",sans-serif;letter-spacing:.2em;text-transform:uppercase}
.bx{font:400 30px/1.4 "Be Vietnam Pro",sans-serif;margin:0}
.ex{font:500 20px "Be Vietnam Pro",sans-serif;opacity:.7}
