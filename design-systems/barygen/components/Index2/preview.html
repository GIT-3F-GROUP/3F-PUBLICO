<!-- @dsCard group="Portal do produtor" height=760 subtitle="Acesso, visão geral, campos, pedidos e preferências" page -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>BARYGEN · Portal do produtor</title>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>body{background:var(--brand-amarelo-suave)}
.app{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
.rail{background:var(--brand-preto);padding:24px 16px;display:flex;flex-direction:column;gap:24px}
.rail nav a{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:8px;font-size:14px;font-weight:600;color:var(--text-on-dark-muted);cursor:pointer;transition:background .15s,color .15s}
.rail nav a:hover{background:rgba(251,249,245,.06);color:var(--brand-amarelo-suave)}
.rail nav a.on{background:var(--brand-amarelo-principal);color:var(--text-body)}
.main{display:flex;flex-direction:column;min-width:0}
.bar{background:#fff;border-bottom:1px solid var(--rule-soft);padding:12px clamp(16px,3vw,32px);display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:10}
.content{padding:clamp(20px,3vw,32px);display:grid;gap:24px}
.panel{background:#fff;border:1px solid var(--rule-soft);border-radius:14px;padding:24px}
.h{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-muted);font-weight:700;margin-bottom:16px}
/* Responsivo: no celular o menu lateral vira uma faixa no topo, rolável na horizontal */
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{padding:14px 16px;gap:12px}
  .rail nav{display:flex;overflow-x:auto;scrollbar-width:none;gap:4px}
  .rail nav a{white-space:nowrap;flex:none}
  .bar{padding:12px 16px;flex-wrap:wrap}
  .content{padding:20px 16px}
  .kit-grid{grid-template-columns:minmax(0,1fr)!important}
}
</style></head><body><div id="root"></div>
<script type="text/babel" src="Login.jsx"></script>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="VisaoGeral.jsx"></script>
<script type="text/babel" src="Pedidos.jsx"></script>
<script type="text/babel" src="Preferencias.jsx"></script>
<script type="text/babel">
function App(){
  const [logged,setLogged]=React.useState(false);
  const [page,setPage]=React.useState('Visão geral');
  if(!logged) return <window.Login onEnter={()=>setLogged(true)}/>;
  return <window.Shell page={page} setPage={setPage} onExit={()=>setLogged(false)}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
