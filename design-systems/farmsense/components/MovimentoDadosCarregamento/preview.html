<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Dados e carregamento</title><style>body{margin:0;padding:16px;font-family:var(--font-sans);color:var(--verde-sombra);background:var(--bege-perola)}.k{font-size:9px;letter-spacing:.12em;text-transform:uppercase;opacity:.5;display:block;margin-top:6px}.demo{display:grid;gap:10px}.cellbox{text-align:center}.pad{background:#fff;border:1px solid rgba(0,65,65,.1);border-radius:var(--r-sm);height:46px;display:grid;place-items:center;font-size:12px;font-weight:500}.dk{background:var(--verde-sombra);color:#fff;border-color:transparent}</style></head><body><div class="demo" style="grid-template-columns:repeat(4,1fr)">
<div class="cellbox"><div class="pad" style="padding:0 10px"><div style="width:100%;height:10px;background:rgba(0,65,65,.08);border-radius:999px;overflow:hidden"><div class="fs-dv-bar" style="height:100%;width:82%;background:var(--verde-sombra)"></div></div></div><span class="k">fs-dv-bar</span></div>
<div class="cellbox"><div class="pad" style="align-items:end;padding:6px"><div style="display:flex;gap:4px;align-items:end;height:34px"><div class="fs-dv-fill" style="width:10px;height:13.600000000000001px;background:var(--verde-anil);animation-delay:0ms"></div><div class="fs-dv-fill" style="width:10px;height:23.799999999999997px;background:var(--verde-anil);animation-delay:80ms"></div><div class="fs-dv-fill" style="width:10px;height:17px;background:var(--verde-anil);animation-delay:160ms"></div><div class="fs-dv-fill" style="width:10px;height:30.6px;background:var(--verde-anil);animation-delay:240ms"></div><div class="fs-dv-fill" style="width:10px;height:22.1px;background:var(--verde-anil);animation-delay:320ms"></div></div></div><span class="k">fs-dv-fill</span></div>
<div class="cellbox"><div class="pad"><svg viewBox="0 0 120 40" style="width:100%;height:34px"><path class="fs-dv-draw" d="M2 34 L 22 28 L 42 30 L 62 18 L 82 20 L 102 8 L 118 4" fill="none" stroke="var(--verde-anil)" stroke-width="2"/></svg></div><span class="k">fs-dv-draw</span></div>
<div class="cellbox"><div class="pad dk"><span class="neon-dot fs-dv-tick"></span></div><span class="k">fs-dv-tick</span></div>
<div class="cellbox"><div class="pad"><svg class="fs-ld-spin" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--verde-sombra)" stroke-width="2"><circle cx="12" cy="12" r="9" opacity=".18"/><path d="M21 12a9 9 0 0 0-9-9"/></svg></div><span class="k">fs-ld-spin</span></div>
<div class="cellbox"><div class="pad" style="padding:8px;display:block"><div class="fs-ld-skeleton" style="height:10px;margin-bottom:6px"></div><div class="fs-ld-skeleton" style="height:10px;width:60%"></div></div><span class="k">fs-ld-skeleton</span></div>
<div class="cellbox"><div class="pad dk" style="padding:8px;display:block"><div class="fs-ld-skeleton-dark" style="height:10px;margin-bottom:6px"></div><div class="fs-ld-skeleton-dark" style="height:10px;width:60%"></div></div><span class="k">fs-ld-skeleton-dark</span></div>
<div class="cellbox"><div class="pad" style="padding:0 10px"><div class="fs-ld-bar" style="width:100%"></div></div><span class="k">fs-ld-bar</span></div></div></body></html>
