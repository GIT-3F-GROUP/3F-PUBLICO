<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Switch</title>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>body{margin:0;padding:16px;background:var(--bege-perola);font-family:var(--font-sans);color:var(--verde-sombra)}.k{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;opacity:.75;display:block;margin:0 0 10px}.pane{border-radius:var(--r-md);padding:16px}.pane-l{background:rgba(0,65,65,.035);border:1px solid rgba(0,65,65,.08)}.pane-d{background:var(--verde-sombra);color:#fff}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const { Switch } = window.FarmSenseDesignSystem_c4c636;
const { useState } = React;
function Demo(){
  const [m,setM]=useState(true); const [on,setOn]=useState(true);
  return (
<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
  <div className="pane pane-l" style={{display:'grid',gap:10}}>
    <Switch label="Relatório mensal por e-mail" checked={m} onChange={()=>setM(!m)} />
    <Switch label="Desabilitado" disabled onChange={()=>{}} />
  </div>
  <div className="pane pane-d"><Switch tone="dark" label="Alertas ao vivo" checked={on} onChange={()=>setOn(!on)} /></div>
</div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
