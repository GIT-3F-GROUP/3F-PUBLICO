<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Fios, molduras e cantos</title><script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>body{margin:0;padding:16px;font-family:var(--font-sans);color:var(--verde-sombra);background:var(--bege-perola)}.k{font-size:9px;letter-spacing:.12em;text-transform:uppercase;opacity:.5;display:block;margin:0 0 8px}.bx{border-radius:var(--r-md);padding:14px}.bl{background:rgba(0,65,65,.035);border:1px solid rgba(0,65,65,.08)}.bd{background:var(--verde-sombra);color:#fff}.gr{display:flex;flex-wrap:wrap;gap:8px;align-items:center}</style></head>
<body><div class="bx bl" style="display:grid;gap:14px"><span class="k">Fios · 8</span><hr class="hairline" style="margin:0"><hr class="hairline" style="margin:0;opacity:.3"><div style="height:1px;background:var(--verde-sombra)"></div><div style="height:2px;background:var(--verde-sombra)"></div><div style="height:1px;background:repeating-linear-gradient(90deg,var(--verde-sombra) 0 6px,transparent 6px 12px);opacity:.4"></div><div style="height:1px;background:linear-gradient(90deg,var(--verde-sombra),transparent);opacity:.5"></div><div style="height:1px;background:linear-gradient(90deg,transparent,var(--ciano-neon),transparent)"></div><div class="fs-in-rule" style="height:2px;background:var(--verde-anil)"></div></div>
<div class="bx bl" style="margin-top:10px;display:grid;grid-template-columns:repeat(6,1fr);gap:10px"><div style="grid-column:1/-1"><span class="k">Molduras e elevações · 12</span></div><div style="height:60px;border-radius:var(--r-xs);border:1px solid rgba(0,65,65,.18)"></div><div style="height:60px;border-radius:var(--r-sm);border:1px solid rgba(0,65,65,.3)"></div><div style="height:60px;border-radius:var(--r-md);border:1px dashed rgba(0,65,65,.3)"></div><div style="height:60px;border-radius:var(--r-lg);border:2px solid var(--verde-sombra)"></div><div style="height:60px;border-radius:var(--r-xl);border:1px solid var(--verde-anil)"></div><div style="height:60px;border-radius:var(--r-pill);border:1px solid rgba(0,65,65,.18)"></div><div style="height:60px;border-radius:var(--r-md);box-shadow:var(--sh-1);background:#fff"></div><div style="height:60px;border-radius:var(--r-md);box-shadow:var(--sh-2);background:#fff"></div><div style="height:60px;border-radius:var(--r-md);box-shadow:var(--sh-3);background:#fff"></div><div style="height:60px;border-radius:var(--r-md);box-shadow:var(--sh-4);background:#fff"></div><div style="height:60px;border-radius:var(--r-md);box-shadow:var(--sh-5);background:#fff"></div><div style="height:60px;border-radius:var(--r-md);background:var(--verde-sombra);box-shadow:var(--sh-neon)"></div></div>
<div class="bx bd" style="margin-top:10px;display:grid;grid-template-columns:repeat(6,1fr);gap:10px"><div style="grid-column:1/-1"><span class="k" style="opacity:.55">Cantos de mira · 6</span></div><div style="position:relative;height:60px;border-radius:var(--r-sm);background:var(--verde-sombra)"><span style="position:absolute;top:8px;left:8px;width:14px;height:14px;border:1px solid var(--ciano-neon);border-bottom:0;border-right:0"></span></div><div style="position:relative;height:60px;border-radius:var(--r-sm);background:var(--verde-sombra)"><span style="position:absolute;top:8px;right:8px;width:14px;height:14px;border:1px solid var(--ciano-neon);border-bottom:0;border-left:0"></span></div><div style="position:relative;height:60px;border-radius:var(--r-sm);background:var(--verde-sombra)"><span style="position:absolute;bottom:8px;left:8px;width:14px;height:14px;border:1px solid var(--ciano-neon);border-top:0;border-right:0"></span></div><div style="position:relative;height:60px;border-radius:var(--r-sm);background:var(--verde-sombra)"><span style="position:absolute;bottom:8px;right:8px;width:14px;height:14px;border:1px solid var(--ciano-neon);border-top:0;border-left:0"></span></div><div style="position:relative;height:60px;border-radius:var(--r-sm);background:var(--verde-sombra)"><span class="fs-am-scan" style="position:absolute;inset:0;border-radius:var(--r-sm)"></span></div><div style="height:60px;border-radius:var(--r-sm);background:var(--verde-sombra);border:1px solid rgba(51,255,194,.4)"></div></div><script>if(window.lucide)lucide.createIcons();</script></body></html>
